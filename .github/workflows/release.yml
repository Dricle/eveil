# Builds the self-hosted image and publishes it to GHCR, so that installing
# Eveil is `docker compose pull` rather than cloning the repository and
# compiling on the target machine.
name: release

on:
  push:
    tags:
      - 'v*'
  # A manual run publishes the branch name as a tag and never moves `latest`
  # (see `flavor` below), which makes it safe for trying a build out.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Lowercase, spelled out rather than derived from `github.repository`: GHCR
  # rejects a repository path containing a capital, and the organisation's own
  # name has one.
  IMAGE: ghcr.io/dricle/eveil

jobs:
  # One job per architecture, each on a runner of that architecture. The
  # obvious alternative - a single job with `platforms: linux/amd64,linux/arm64`
  # - emulates arm64 through QEMU, and this build compiles a PECL extension and
  # runs a full Vite build, which under emulation takes hours or times out.
  # Both runner labels are free on a public repository.
  build:
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      # Let the other architecture finish and report rather than be cancelled:
      # knowing that amd64 built and arm64 did not is the useful outcome.
      fail-fast: false
      matrix:
        # Both runners are pinned to the same Ubuntu generation. `ubuntu-latest`
        # would move under us while the arm64 label stays put, leaving the two
        # halves of one manifest built on different distributions.
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `linux/amd64` is not a legal artifact name; `linux-amd64` is.
      - name: Name this platform
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pushed by digest, with no tag: a tag here would mean the two
      # architectures overwriting each other's. The `merge` job below is what
      # turns the two digests into one tagged, multi-architecture image. A
      # digest nobody references is untagged storage in the package, not a
      # published release - which is what makes it safe for this job to push
      # before the other architecture is known to have worked.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Skipped entirely if either architecture failed, so a half-built release is
  # never tagged.
  merge:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tag `v1.3.0` publishes `1.3.0`, `1.3` and `latest`; the `v` is dropped
      # because that is what every other image on a registry does. `latest=auto`
      # moves `latest` on a version tag and on nothing else, so a manual run
      # from a branch publishes only that branch's name.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      - name: Create the manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect what was published
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"
        env:
          TAG: ${{ steps.meta.outputs.version }}
