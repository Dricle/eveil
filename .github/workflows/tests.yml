name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # PostgreSQL everywhere, tests included (ADR-010). `.env.example` points at
    # `pgsql`, the Sail-internal hostname; Laravel's Dotenv is immutable, so the
    # job-level env below wins over the file.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eveil
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d eveil"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # DB_DATABASE is deliberately absent: PHPUnit does not overwrite an env var
    # that already exists, so setting it here would silently run the suite
    # against `eveil` instead of the `testing` database phpunit.xml asks for.
    # `.env.example` supplies it for the migrate step.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: sail
      DB_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # phpunit.xml runs the suite against a separate `testing` database; the
      # service image only creates `eveil`.
      - name: Create testing database
        run: PGPASSWORD=password psql -h 127.0.0.1 -U sail -d eveil -c 'CREATE DATABASE testing'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
