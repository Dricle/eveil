# The self-hosted stack. From a clone of this repository:
#
#   cp deploy/.env.example .env
#   # fill in APP_KEY, CREDENTIALS_KEY, the two passwords and ADMIN_*
#   docker compose -f compose.deploy.yaml up -d
#
# At the repository ROOT rather than inside `deploy/` for one practical reason:
# Compose takes its project directory from wherever the compose file lives, so a
# file under `deploy/` would look for `deploy/.env` and never read the `.env` the
# instructions just told you to write.
#
# Deliberately NOT the compose file at the repository root: that one is Laravel
# Sail, which mounts the source, shifts its ports off the usual ones and runs
# Vite. Conflating them would mean a development stack shipped as a product.
name: eveil

services:
    # nginx, PHP-FPM, the queue workers and the scheduler, under supervisord.
    # Plain HTTP: TLS belongs to whatever sits in front, which on a self-hosted
    # box is usually a reverse proxy that already has the certificates.
    app:
        build:
            context: .
            dockerfile: deploy/Dockerfile
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
        env_file: .env
        volumes:
            # The only writable state that is not in Postgres.
            - storage:/var/www/storage/app
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        # Long enough for a job mid-crawl to finish rather than be killed and
        # retried from the start.
        stop_grace_period: 120s

    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:-eveil}'
            POSTGRES_USER: '${DB_USERNAME:-eveil}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?set DB_PASSWORD in .env}'
        volumes:
            # `/var/lib/postgresql`, not `/data`: from 18 the image keeps its
            # data in major-version-specific directories underneath, and mounting
            # the old path is a hard error rather than a warning.
            - pgsql:/var/lib/postgresql
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME:-eveil}', '-d', '${DB_DATABASE:-eveil}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: 'redis:8-alpine'
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    # Discovery's search source. Self-hosted so a first run needs no third-party
    # API key at all, which is the whole promise of the free edition.
    searxng:
        image: 'searxng/searxng:latest'
        restart: unless-stopped
        environment:
            SEARXNG_BASE_URL: 'http://searxng:8080/'
            SEARXNG_SECRET: '${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}'
        volumes:
            - './docker/searxng/settings.yml:/etc/searxng/settings.yml:ro'

volumes:
    pgsql:
    redis:
    storage:
