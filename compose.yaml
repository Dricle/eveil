# Local development environment (Laravel Sail).
# Default host ports are shifted off the usual 80/5432/6379 so this stack can
# run alongside other local projects. The self-hosted deployment compose
# promised by Epic 1 is a separate artifact - do not conflate the two.
services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8080}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - searxng
    # The workers, in the same image as the app so they share its PHP and its
    # code mount. Nothing queued moves without this container running.
    horizon:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        command: ['php', '/var/www/html/artisan', 'horizon']
        stop_signal: SIGTERM
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - redis
            - searxng
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5442}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6382}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1035}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8035}:8025'
        networks:
            - sail
    searxng:
        image: 'searxng/searxng:latest'
        ports:
            - '${FORWARD_SEARXNG_PORT:-8090}:8080'
        environment:
            SEARXNG_BASE_URL: 'http://localhost:${FORWARD_SEARXNG_PORT:-8090}/'
        volumes:
            - './docker/searxng:/etc/searxng:ro'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/ || exit 1']
            retries: 5
            timeout: 5s
    # Second web-search source (issue #27), off by default: `docker compose
    # --profile degoog up` to run it. Never a dependency of laravel.test or
    # horizon - a source that fails is caught and reported, never fatal
    # (`ReportsFailures`), so nothing here needs it running to boot.
    #
    # `DEGOOG_SETTINGS_PASSWORDS` gates the settings API degoog needs
    # `searxApiEnabled` flipped through; see docs/self-hosted for the
    # one-time curl that turns it on after first boot.
    degoog:
        image: 'ghcr.io/degoog-org/degoog:latest'
        profiles: ['degoog']
        ports:
            - '${FORWARD_DEGOOG_PORT:-8091}:4444'
        environment:
            DEGOOG_SETTINGS_PASSWORDS: '${DEGOOG_SETTINGS_PASSWORDS:-changeme}'
        volumes:
            - 'sail-degoog:/app/data'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-degoog:
        driver: local
