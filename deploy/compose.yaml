# The self-hosted stack. From a clone of this repository:
#
#   cp deploy/.env.example .env
#   # fill in APP_KEY, CREDENTIALS_KEY, the two passwords and ADMIN_*
#   docker compose -f deploy/compose.yaml up -d
#
# Deliberately NOT the compose file at the repository root: that one is Laravel
# Sail, which mounts the source, shifts its ports off the usual ones and runs
# Vite. Conflating them would mean a development stack shipped as a product.
name: eveil

services:
    app:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
            - '${APP_TLS_PORT:-443}:443'
        env_file: ../.env
        volumes:
            # The only writable state that is not in Postgres: uploaded files and
            # Caddy's certificates.
            - storage:/app/storage/app
            - caddy:/data
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # The workers. Nothing queued moves without this — no discovery, no sending,
    # no reading replies.
    horizon:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
        restart: unless-stopped
        command: ['php', 'artisan', 'horizon']
        stop_signal: SIGTERM
        stop_grace_period: 60s
        env_file: ../.env
        volumes:
            - storage:/app/storage/app
        depends_on:
            app:
                condition: service_started

    # Sending is paced from here: without the scheduler nothing leaves, no
    # replies are read, and Horizon's metrics stay empty.
    scheduler:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
        restart: unless-stopped
        command: ['php', 'artisan', 'schedule:work']
        env_file: ../.env
        depends_on:
            app:
                condition: service_started

    pgsql:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:-eveil}'
            POSTGRES_USER: '${DB_USERNAME:-eveil}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?set DB_PASSWORD in .env}'
        volumes:
            # `/var/lib/postgresql`, not `/data`: from 18 the image keeps its
            # data in major-version-specific directories underneath, and mounting
            # the old path is a hard error rather than a warning.
            - pgsql:/var/lib/postgresql
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME:-eveil}', '-d', '${DB_DATABASE:-eveil}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: 'redis:8-alpine'
        restart: unless-stopped
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    # Discovery's search source. Self-hosted so a first run needs no third-party
    # API key at all, which is the whole promise of the free edition.
    searxng:
        image: 'searxng/searxng:latest'
        restart: unless-stopped
        environment:
            SEARXNG_BASE_URL: 'http://searxng:8080/'
            SEARXNG_SECRET: '${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}'
        volumes:
            - '../docker/searxng/settings.yml:/etc/searxng/settings.yml:ro'

volumes:
    pgsql:
    redis:
    storage:
    caddy:
