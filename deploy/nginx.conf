# Plain HTTP on purpose: TLS belongs to whatever sits in front. A reverse proxy,
# Traefik, Caddy, a load balancer. An instance that insists on terminating TLS
# itself fights the proxy most self-hosters already run.
server {
    listen 80;
    server_name _;
    root /var/www/public;

    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    # The reverse proxy in front is what the browser talks to, so the scheme and
    # host it saw are the ones the app has to generate links with.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # The host the browser actually used, port included: without it a
        # redirect from an instance published on a non-standard port loses that
        # port and sends the visitor somewhere that does not answer.
        fastcgi_param HTTP_HOST $http_host;
        include fastcgi_params;

        # A discovery run's HTTP request can be slow; the default 60s cuts one
        # off mid-crawl.
        fastcgi_read_timeout 300;
    }

    # Nothing under a dot is ever served, and .env is the reason.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
