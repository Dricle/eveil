; The four processes an instance needs. Each is restarted on its own: the site
; staying up while a worker is restarting is the whole point of running them
; under a supervisor rather than as one command.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Nothing queued moves without this: no discovery, no sending, no reading
; replies. `stopwaitsecs` is generous because a job mid-crawl should be allowed
; to finish rather than be killed and retried.
[program:horizon]
command=php /var/www/artisan horizon
autorestart=true
stopwaitsecs=120
stopsignal=TERM
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Sending is paced from here, five minutes at a time. Without it nothing leaves
; and no reply is ever read.
[program:scheduler]
command=php /var/www/artisan schedule:work
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
